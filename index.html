<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relentless.study · A private AI tutor for everyone</title>
  <meta name="description" content="Relentless.study is an AI tutor that teaches you one to one, from your own notes and books, and plans your study up to your deadlines. Opening soon.">
  <meta property="og:site_name" content="Relentless.study">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://relentless.study/">
  <meta property="og:title" content="Relentless.study · A private AI tutor for everyone">
  <meta property="og:description" content="An AI tutor that teaches you one to one, from your own notes and books, and plans your study up to your deadlines. Opening soon.">
  <link rel="canonical" href="https://relentless.study/">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/fonts/baloo2-700.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* The brand fonts, served from this site like the main one, so no visitor's address goes to a font host. */
    @font-face {
      font-family: "Baloo 2";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/fonts/baloo2-700.woff2") format("woff2");
    }
    @font-face {
      font-family: "Figtree";
      font-style: normal;
      font-weight: 300 900;
      font-display: swap;
      src: url("/fonts/figtree.woff2") format("woff2");
    }

    /* Colours from the product's own tokens (packages/tokens), light and dark. */
    :root {
      --canvas: #faf9f6;
      --ink: #15120e;
      --ink-muted: #5f5b54;
      --ink-faint: #a39e95;
      --line: #e6e3dc;
      --sun: #ffd84a;
      --on-sun: #15120e;
      --sun-wash: #fff2c4;
      --sticker: 0 3px 0 0 #15120e;
      --display: "Baloo 2", system-ui, sans-serif;
      --body: Figtree, "Noto Sans", system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #121110;
        --ink: #f5f2ec;
        --ink-muted: #b3aea5;
        --ink-faint: #6e6a63;
        --line: #34312c;
        --sun-wash: #3a3112;
        --sticker: 0 3px 0 0 #000000;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      background: var(--canvas);
      color: var(--ink);
      font: 400 16px/24px var(--body);
      -webkit-font-smoothing: antialiased;
    }

    .bar {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 1120px;
      margin-inline: auto;
      padding: 20px 16px;
      font: 700 20px/1 var(--display);
      letter-spacing: -0.01em;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 720px;
      margin-inline: auto;
      padding: 8px 16px 48px;
      text-align: center;
    }

    .mino {
      width: 200px;
      height: 200px;
      margin-bottom: -12px;
    }
    @media (prefers-reduced-motion: no-preference) {
      .mino { animation: drift 4.5s ease-in-out infinite; }
      @keyframes drift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    }

    .soon {
      margin: 0;
      padding: 6px 16px 5px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--sun);
      color: var(--on-sun);
      box-shadow: var(--sticker);
      font: 600 15px/20px var(--body);
    }
    @media (prefers-color-scheme: dark) {
      .soon { border-color: #15120e; }
    }

    h1 {
      margin: 4px 0 0;
      font: 700 clamp(36px, 7vw, 60px) / 1.05 var(--display);
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .lead {
      margin: 0;
      max-width: 34ch;
      color: var(--ink-muted);
      font: 400 clamp(17px, 2.4vw, 20px) / 1.5 var(--body);
      text-wrap: pretty;
    }

    footer {
      width: 100%;
      max-width: 1120px;
      margin-inline: auto;
      padding: 20px 16px 28px;
      border-top: 1px solid var(--line);
      color: var(--ink-faint);
      font: 400 14px/20px var(--body);
      text-align: center;
    }
  </style>
</head>
<body>
  <header class="bar"><span translate="no">Relentless.study</span></header>
  <main>
    <img class="mino" src="/mino.svg" alt="" width="200" height="200">
    <p class="soon">Opening soon</p>
    <h1>A private tutor for everyone</h1>
    <p class="lead">An AI tutor that teaches you one to one, from your own notes and books, and plans your study up to your deadlines.</p>
  </main>
  <footer>© 2026 <span translate="no">Relentless.study</span></footer>
</body>
</html>
